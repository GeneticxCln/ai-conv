services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-conv-ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-conv-backend
    ports:
      - "3001:3001"
      - "3002:3002"  # Socket.io port
    environment:
      - NODE_ENV=development
      - OLLAMA_HOST=http://ollama:11434
      - CORS_ORIGIN=http://localhost:5173
      - PORT=3001
      - DATABASE_PATH=/data/ai-conv.db
      - PERSONAS_DIR=/config/personas
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./config:/config:ro
      - sqlite_data:/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-conv-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  sqlite_data:

networks:
  default:
    name: ai-conv-network
