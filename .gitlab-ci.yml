# GitLab CI — ported 1:1 from .github/workflows/ci.yml (GitHub Actions).
#
# Job mapping:
#   typecheck-and-lint -> lint          (types build + backend/frontend lint)
#   test-backend       -> test:backend  (143 vitest suites)
#   test-frontend      -> test:frontend (59 vitest suites)
#   test-e2e           -> test:e2e      (Playwright against a real Ollama service)
#   docker-build       -> docker:build  (backend + frontend images, compose config check)
#
# The repo is npm-workspaces based; every job installs once at the root and
# runs workspace scripts. Node 20 matches the engines field and GH workflow.

stages:
  - build
  - test
  - e2e
  - images
  - release

variables:
  GIT_SUBMODULE_STRATEGY: normal
  NODE_OPTIONS: "--max-old-space-size=4096"
  # Single source of truth for Playwright. The E2E image tag is derived from
  # it below, and scripts/check-playwright-version.mjs fails the pipeline if
  # frontend/package.json pins anything else (package.json cannot interpolate
  # a CI variable, so the match is enforced rather than assumed).
  PLAYWRIGHT_VERSION: "1.62.1"
  # Redirect npm's download cache and node-gyp's header cache INTO the
  # project dir so the job cache can actually capture them. Without this,
  # npm writes to ~/.npm (outside $CI_PROJECT_DIR) and the cached .npm/
  # archive stays empty.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_devdir: "$CI_PROJECT_DIR/.gyp"

default:
  # Node 26 — undici@8 (backend dep) requires >= 22.19 and the dev machine
  # runs v26; Node 20 workers crash in vitest with
  # "webidl.util.markAsUncloneable is not a function".
  image: node:26-bookworm
  before_script:
    - npm ci --legacy-peer-deps
    # Same as the GH workflow's "Generate JWT secret" step: tests and builds
    # refuse to run with the default dev secret.
    - export JWT_SECRET="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"

.npm_cache: &npm_cache
  # Keyed on the lockfile so a dependency bump invalidates the cache.
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .gyp/

# ---------------------------------------------------------------------------
# Stage: build
# ---------------------------------------------------------------------------
lint:
  stage: build
  <<: *npm_cache
  script:
    - node scripts/check-playwright-version.mjs
    - node scripts/check-version-sync.mjs
    - npm run build --workspace=packages/types
    - npm run build --workspace=backend
    - npm run build --workspace=frontend
    - npm run lint --workspace=backend
    - npm run lint --workspace=frontend
    - npm run lint --workspace=packages/types

# ---------------------------------------------------------------------------
# Stage: test
# ---------------------------------------------------------------------------
test:backend:
  stage: test
  <<: *npm_cache
  script:
    - npm run build --workspace=packages/types
    - npm test --workspace=backend

test:frontend:
  stage: test
  <<: *npm_cache
  script:
    - npm run build --workspace=packages/types
    - npm test --workspace=frontend

# ---------------------------------------------------------------------------
# Stage: e2e — Playwright against a real Ollama service container.
#
# GitLab services cannot be `docker exec`ed, so models are pulled via Ollama's
# HTTP API (POST /api/pull) instead of `ollama pull` in the service container.
# Models match ci.yml exactly: qwen2.5:0.5b (smallest chat model, so streaming
# E2E stays fast) + nomic-embed-text (so the Settings EMBEDDING badge test is
# meaningful). The backend in the Playwright webServer talks to
# http://ollama:11434 — "ollama" is the service hostname GitLab injects.
# ---------------------------------------------------------------------------
test:e2e:
  stage: e2e
  <<: *npm_cache
  # Browsers must match the installed @playwright/test exactly. The version
  # comes from the single PLAYWRIGHT_VERSION variable at the top of this file;
  # the before_script check fails the job if frontend/package.json drifts.
  image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-jammy
  # Serialize E2E across ALL pipelines (main + tags often push together):
  # each run spawns two Vite dev servers, the backend, Chromium and an Ollama
  # container — two concurrent runs starve the shared runner's CPU and the
  # backend's websocket handshake stalls past global-setup's timeout.
  resource_group: e2e-tests
  services:
    - name: ollama/ollama:latest
      alias: ollama
      # Pull is done in before_script; give the server time to boot on entry.
      command: ["serve"]
  variables:
    OLLAMA_HOST: http://ollama:11434
    PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
    DATABASE_PATH: /tmp/ai-conv-e2e.db
    FF_NETWORK_PER_BUILD: 1
  before_script:
    # The image tag is derived from PLAYWRIGHT_VERSION; fail fast if the pinned
    # package in frontend/package.json drifted from it.
    - node scripts/check-playwright-version.mjs
    # Match the rest of the pipeline: undici@8 needs Node >= 22.19, and the
    # Playwright image's distro Node is older.
    - curl -sL https://deb.nodesource.com/setup_26.x | bash - > /dev/null && apt-get update > /dev/null && apt-get install -y nodejs > /dev/null
    # The Playwright image has no C toolchain. better-sqlite3 ships no
    # prebuilt binary for this Node ABI, so node-gyp must compile it.
    - apt-get install -y build-essential python3 > /dev/null
    # Node deps (root + frontend) — the Playwright image ships the browsers,
    # so no npx playwright install needed.
    - npm ci --legacy-peer-deps
    - export JWT_SECRET="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
    # Wait for the Ollama service to answer, then pull models via HTTP API.
    - |
      for i in $(seq 1 60); do
        if curl -fsS "$OLLAMA_HOST/api/tags" >/dev/null 2>&1; then break; fi
        sleep 2
      done
      curl -fsS "$OLLAMA_HOST/api/tags" >/dev/null

      # /api/pull streams progress until the download finishes. Never pipe it
      # into `head`: closing the pipe aborts the pull, leaving no model behind
      # for the suite. Drain the stream and fail loudly when a model is absent.
      pull_model() {
        echo "--- pulling $1 ---"
        curl -fsS -X POST "$OLLAMA_HOST/api/pull" \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$1\"}" -o /dev/null
      }
      pull_model qwen2.5:0.5b
      pull_model nomic-embed-text

      echo "--- installed models ---"
      curl -fsS "$OLLAMA_HOST/api/tags"
      echo
      for model in qwen2.5:0.5b nomic-embed-text; do
        if ! curl -fsS "$OLLAMA_HOST/api/tags" | grep -q "$model"; then
          echo "$model is not installed after /api/pull" >&2
          exit 1
        fi
      done
  script:
    - npm run test:e2e --workspace=frontend
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - frontend/test-results/
      - frontend/playwright-report/
  # E2E is the slowest job; give it room on shared runners.
  timeout: 45m

# ---------------------------------------------------------------------------
# Stage: images — same builds as ci.yml docker-build job.
# ---------------------------------------------------------------------------
docker:build:
  stage: images
  image: docker:27
  # docker:27 is the CLI-only image; the compose plugin is packaged
  # separately, so `docker compose` is NOT available until it is installed.
  before_script:
    - apk add --no-cache docker-cli-compose
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    # Talk to the dind service over the plain socket. TLS requires the runner
    # to mount /certs/client (only runners registered with
    # --docker-volumes /certs/client have it), which is not guaranteed here.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_BACKEND: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    IMAGE_FRONTEND: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  script:
    # Nothing is pushed anywhere, so no registry login is needed (and it fails
    # outright when the project registry is disabled).
    - docker build -f backend/Dockerfile -t "$IMAGE_BACKEND" .
    - docker build
        --build-arg VITE_WS_URL=http://localhost:3001
        --build-arg VITE_API_URL=http://localhost:3001
        -f frontend/Dockerfile
        -t "$IMAGE_FRONTEND" .
    # compose config validates interpolation; JWT_SECRET is declared
    # required in docker-compose.yml — a placeholder is enough for validation.
    - JWT_SECRET=docker-compose-config-placeholder docker compose -f docker-compose.yml config --quiet
    # Container smoke test for LOCAL_CLIENT_CIDRS. The unit tests only cover
    # loopback; a published port NATs the host browser to the bridge gateway,
    # so this is the only place that path runs for real. Two backends on one
    # network: one trusts the network's actual subnet, one trusts TEST-NET-1
    # (never routable), so the only difference is the CIDR configuration.
    - |
      set -e
      docker network create ai-conv-smoke
      SUBNET=$(docker network inspect ai-conv-smoke -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}')
      echo "smoke network subnet: $SUBNET"
      # Throwaway containers only — the image has no node to mint a real one.
      SMOKE_JWT="smoke-only-not-a-real-secret-0123456789abcdef0123456789abcdef"
      docker run -d --name smoke-trusted --network ai-conv-smoke \
        -e JWT_SECRET="$SMOKE_JWT" -e DATABASE_PATH=/tmp/smoke.db \
        -e LOCAL_CLIENT_CIDRS="$SUBNET" "$IMAGE_BACKEND"
      docker run -d --name smoke-untrusted --network ai-conv-smoke \
        -e JWT_SECRET="$SMOKE_JWT" -e DATABASE_PATH=/tmp/smoke.db \
        -e LOCAL_CLIENT_CIDRS=192.0.2.0/24 "$IMAGE_BACKEND"
      # socket.io-client is installed next to the script in /tmp: the repo's
      # node_modules is not mounted into this ad-hoc container.
      docker run --rm --network ai-conv-smoke \
        -v "$CI_PROJECT_DIR/scripts":/scripts:ro node:26-bookworm \
        sh -c 'cd /tmp && npm i --no-save --no-fund --no-audit --silent socket.io-client@4 >/dev/null && cp /scripts/docker-local-client-smoke.cjs . && node docker-local-client-smoke.cjs http://smoke-trusted:3001 http://smoke-untrusted:3001' \
        || { docker logs smoke-trusted 2>&1 | tail -40; docker logs smoke-untrusted 2>&1 | tail -40; exit 1; }
    # Build-only validation on MRs/main; nothing is pushed anywhere.
    # The smoke containers still reference these images, and `docker rmi`
    # refuses to remove an image a container holds — remove them first.
    - |
      docker rm -f smoke-trusted smoke-untrusted > /dev/null 2>&1 || true
      docker network rm ai-conv-smoke > /dev/null 2>&1 || true
      docker rmi "$IMAGE_BACKEND" "$IMAGE_FRONTEND"
  rules:
    # Docker build is slow; run it on main and MRs, skip for plain branch pushes.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# Stage: release — signed Tauri desktop build published on git tags (v*).
# Ported from .github/workflows/release.yml. Steps:
#   1. Frontend → dist-tauri, backend rebundled, sidecar built (build-tauri.sh)
#   2. `tauri build` with the minisign key from the TAURI_SIGNING_PRIVATE_KEY
#      CI variable → signed updater artifacts (AppImage.tar.gz + .sig)
#   3. Artifacts + latest.json uploaded to the generic package registry
#   4. GitLab Release created with asset links; the updater permalink
#      (.../-/releases/permalink/latest/downloads/latest.json) then serves it
# ---------------------------------------------------------------------------
release:tauri:
  stage: release
  image: ghcr.io/catthehacker/ubuntu:act-latest
  before_script: []
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    # linuxdeploy (AppImage bundling) self-extracts via FUSE, which CI
    # runners don't have — this env makes it extract to a temp dir instead.
    APPIMAGE_EXTRACT_AND_RUN: "1"
    # Redirect rustup + cargo into the project dir so the caches below can
    # capture the toolchain, the crate registry, and the git db. Without
    # this every tag re-downloads ~700 crates and a full rust toolchain.
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    # Independent entries: toolchain changes rarely; the crate registry is
    # keyed on Cargo.lock so dependency bumps invalidate only that part.
    - key: "rustup-stable-toolchain"
      paths:
        - .rustup/
    - key:
        files:
          - src-tauri/Cargo.lock
      paths:
        - .cargo/
    - key:
        files:
          - package-lock.json
      paths:
        - .npm/
        - .gyp/
  script:
    # Full Tauri 2 Linux prerequisite set (docs: libwebkit2gtk-4.1-dev,
    # build-essential, libxdo-dev, libssl-dev, libayatana-appindicator3-dev,
    # librsvg2-dev, patchelf). libxdo-dev was missing and breaks the build.
    # xdg-utils provides /usr/bin/xdg-open, which the AppImage bundler
    # requires (the tag build died with "xdg-open binary not found").
    - apt-get update > /dev/null && apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config patchelf xdg-utils curl jq file > /dev/null
    - curl -sL https://deb.nodesource.com/setup_26.x | bash - > /dev/null && apt-get install -y nodejs > /dev/null
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal > /dev/null
    - source "$CARGO_HOME/env"
    - npm ci --legacy-peer-deps
    # The Tauri bundle ships the compiled backend (bundle-backend.cjs copies
    # backend/dist) — a fresh checkout must build it first.
    - npm run build --workspace=packages/types
    - npm run build --workspace=backend
    # The built app's version, src-tauri/tauri.conf.json and the tag must all
    # agree, otherwise latest.json advertises a version the app never reports.
    - node scripts/check-version-sync.mjs
    - |
      # The Tauri CLI signs updater artifacts when TAURI_SIGNING_PRIVATE_KEY
      # (or _PATH) is set; the CI variable holds the full key contents.
      if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
        echo "TAURI_SIGNING_PRIVATE_KEY is not set — updater artifacts would be unsigned" >&2
        exit 1
      fi
    - npm run tauri:build -- --cli
    - echo "--- bundle outputs ---" && find src-tauri/target/release/bundle -type f | sort
    # Upload every bundle artifact (installers + updater tarballs + sigs) to
    # the generic package registry. JOB-TOKEN authenticates uploads.
    - |
      BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ai-conv-desktop/${CI_COMMIT_TAG}"
      BUNDLE_DIR="src-tauri/target/release/bundle"
      for f in $(find "$BUNDLE_DIR" -type f); do
        rel="${f#$BUNDLE_DIR/}"
        curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "$BASE/$rel" > /dev/null || { echo "upload failed: $f" >&2; exit 1; }
        echo "uploaded: $rel"
      done
    # latest.json — the updater manifest the permalink endpoint serves.
    - |
      VER="${CI_COMMIT_TAG#v}"
      BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ai-conv-desktop/${CI_COMMIT_TAG}"
      BUNDLE_DIR="src-tauri/target/release/bundle"
      APPIMG_TGZ=$(find "$BUNDLE_DIR" -name '*.AppImage.tar.gz' | head -1)
      APPIMG_SIG=$(find "$BUNDLE_DIR" -name '*.AppImage.tar.gz.sig' | head -1)
      [ -n "$APPIMG_TGZ" ] && [ -n "$APPIMG_SIG" ] || { echo "updater artifacts missing" >&2; exit 1; }
      DL="$BASE/appimage/$(basename "$APPIMG_TGZ")"
      SIG_B64=$(base64 -w0 "$APPIMG_SIG")
      jq -n --arg ver "$VER" --arg url "$DL" --arg sig "$SIG_B64" '{version:$ver, notes:("AI Conv " + $ver), platforms:{"linux-x86_64":{signature:$sig, url:$url}}}' > latest.json
      curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file latest.json "$BASE/latest.json" > /dev/null
      echo "latest.json uploaded"
    # Create the GitLab Release with asset links via the Releases API
    # (JOB-TOKEN is accepted there).
    - |
      VER="${CI_COMMIT_TAG#v}"
      BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ai-conv-desktop/${CI_COMMIT_TAG}"
      BUNDLE_DIR="src-tauri/target/release/bundle"
      ASSET_FILES=$(find "$BUNDLE_DIR" -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \))
      # NOTE: the assignments must come BEFORE `node`, otherwise they are
      # argv entries and process.env.* is undefined (ASSET_FILES.split threw
      # on every tag pipeline).
      BASE="$BASE" CI_COMMIT_TAG="$CI_COMMIT_TAG" VER="$VER" ASSET_FILES="$ASSET_FILES" node -e '
        const fs = require("fs");
        const base = process.env.BASE;
        const tag = process.env.CI_COMMIT_TAG;
        const ver = process.env.VER;
        const files = process.env.ASSET_FILES.split("\n").filter(Boolean);
        const links = files.map((f) => ({
          name: f.split("/").pop(),
          url: base + "/" + f.replace("src-tauri/target/release/bundle/", ""),
        }));
        fs.writeFileSync("release.json", JSON.stringify({
          tag_name: tag,
          name: "AI Conv v" + ver,
          description: "Desktop build " + tag + "\n\nAuto-update endpoint: https://gitlab.com/GeneticxClm/ai-conv/-/releases/permalink/latest/downloads/latest.json",
          assets: { links },
        }));
      '
      curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --header "Content-Type: application/json" --data @release.json "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" > /dev/null
      echo "release created"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  timeout: 60m
