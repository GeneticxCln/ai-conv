name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '26'
  PLAYWRIGHT_VERSION: '1.62.1'

jobs:
  typecheck-and-lint:
    name: TypeCheck and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Generate JWT secret
        run: echo "JWT_SECRET=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")" >> "$GITHUB_ENV"
      - run: node scripts/check-playwright-version.mjs
      - run: node scripts/check-version-sync.mjs
      - run: npm run build --workspace=packages/types
      - run: npm run build --workspace=backend
      - run: npm run build --workspace=frontend
      - run: npm run lint --workspace=backend
      - run: npm run lint --workspace=frontend
      - run: npm run lint --workspace=packages/types

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Generate JWT secret
        run: echo "JWT_SECRET=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")" >> "$GITHUB_ENV"
      - run: npm run build --workspace=packages/types
      - run: npm test --workspace=backend

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build --workspace=packages/types
      - run: npm test --workspace=frontend

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Generate JWT secret
        run: echo "JWT_SECRET=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")" >> "$GITHUB_ENV"
      - run: npm run build --workspace=packages/types
      - name: Start Ollama with a small chat model
        run: |
          docker run -d --name ollama-ci -p 11434:11434 -v ollama-ci:/root/.ollama ollama/ollama:latest
          # Wait for the server to answer, then pull the smallest useful model
          # so the persona/streaming E2E tests run fast. The E2E suite
          # auto-selects the smallest chat model, and docker-compose's
          # model-puller pulls the same qwen2.5:0.5b — keep the two in sync so
          # CI and local runs use the identical model.
          for i in $(seq 1 30); do
            if docker exec ollama-ci ollama list >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec ollama-ci ollama pull qwen2.5:0.5b
          # Keep an embedding model available so the Settings E2E verifies its
          # EMBEDDING badge instead of passing vacuously in CI.
          docker exec ollama-ci ollama pull nomic-embed-text
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run test:e2e --workspace=frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          DATABASE_PATH: ${{ runner.temp }}/ai-conv-e2e.db
          OLLAMA_HOST: http://localhost:11434

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Generate JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: ai-conv/backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            VITE_WS_URL=http://localhost:3001
            VITE_API_URL=http://localhost:3001
          push: false
          tags: ai-conv/frontend:ci
      - run: docker compose -f docker-compose.yml config --quiet
