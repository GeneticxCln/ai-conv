name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  package:
    name: Electron package smoke
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npx electron-builder --dir --linux
      - name: Launch packaged binary and assert real render
        run: |
          # The renderer must actually mount: an untitled window = white screen.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool
          xvfb-run -a ./dist/linux-unpacked/ai-conv --no-sandbox --disable-gpu &
          APP_PID=$!
          sleep 12
          kill -0 $APP_PID || { echo "app process died"; exit 1; }
          WID=$(xdotool search --onlyvisible --name "AI Conv" | head -1)
          if [ -z "$WID" ]; then
            echo "FAIL: no window titled 'AI Conv' — renderer never mounted (blank window)"
            kill $APP_PID
            exit 1
          fi
          echo "OK: window '$(xdotool getwindowname "$WID")' present"
          kill $APP_PID
